[project]
name = "tunneler"
version = "0.1.0"
description = "Automatically create Cloudflare tunnels for any process"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "qrcode>=7.0",
    "coolname>=2.0",
]

[project.scripts]
tunneler = "tunneler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
